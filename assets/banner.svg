<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #818cf8;
      letter-spacing: 1px;
    }
    
    /* Dynamic Animated Elements in Background */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.5; }
      50% { transform: translateY(25px) translateX(-20px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.5; }
    }
    @keyframes rotateShield {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }

    .anim-pulse {
      animation: pulseGlow 4s infinite ease-in-out;
      transform-origin: center;
    }
    .anim-float-1 {
      animation: floatParticle1 6s infinite ease-in-out;
    }
    .anim-float-2 {
      animation: floatParticle2 8s infinite ease-in-out;
    }
    .anim-rotate {
      animation: rotateShield 20s linear infinite;
      transform-origin: 1020px 180px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay pattern in background -->
  <g opacity="0.08">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360 M640 0 V360 M720 0 V360 M800 0 V360 M880 0 V360 M960 0 V360 M1040 0 V360 M1120 0 V360" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Animated Ambient Glow Spheres (Background) -->
  <circle cx="1020" cy="180" r="160" fill="url(#glowGrad)" class="anim-pulse" />
  <circle cx="150" cy="90" r="120" fill="url(#glowGrad)" class="anim-pulse" style="animation-delay: -2s;" />

  <!-- Animated Floating Security Nodes / Hexagons (Background Layer) -->
  <g class="anim-float-1" opacity="0.5">
    <polygon points="900,80 920,90 920,110 900,120 880,110 880,90" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="900" cy="100" r="4" fill="#38bdf8" />
  </g>
  <g class="anim-float-2" opacity="0.6">
    <polygon points="1120,260 1140,270 1140,290 1120,300 1100,290 1100,270" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="1120" cy="280" r="4" fill="#a855f7" />
  </g>

  <!-- Decorative Orbit Ring on Right Side -->
  <g class="anim-rotate" opacity="0.3">
    <circle cx="1020" cy="180" r="110" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 12" />
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Large Right Graphic: Shield Icon -->
  <g filter="url(#dropShadow)">
    <!-- Base Shield -->
    <path d="M1020 80 C1070 80 1100 110 1100 160 C1100 230 1020 270 1020 270 C1020 270 940 230 940 160 C940 110 970 80 1020 80 Z" fill="url(#shieldGrad)" opacity="0.85" />
    <path d="M1020 95 C1058 95 1082 120 1082 160 C1082 218 1020 250 1020 250 C1020 250 958 218 958 160 C958 120 982 95 1020 95 Z" fill="#0f172a" opacity="0.9" />
    
    <!-- Lock Mechanism Inside Shield -->
    <rect x="1000" y="165" width="40" height="32" rx="6" fill="#38bdf8" />
    <path d="M1008 165 V150 C1008 143 1013 138 1020 138 C1027 138 1032 143 1032 150 V165" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="1020" cy="178" r="4" fill="#0f172a" />
    <path d="M1020 182 V188" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT (Left Side: Title, Subtitle, Badges) -->
  <g transform="translate(80, 0)">
    <!-- Category Tag -->
    <g transform="translate(0, 65)">
      <rect width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="125" y="20" text-anchor="middle" class="badge-text">DIGITAL SAFETY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" class="title" filter="url(#dropShadow)">Awesome Parental Controls</text>
    <text x="0" y="195" class="title" fill="#a855f7" filter="url(#dropShadow)">&amp; Family Protection 🛡️</text>

    <!-- Subtitle -->
    <text x="0" y="245" class="subtitle">Curated SaaS Platforms, DNS Filters &amp; Local-First Open-Source Tools</text>

    <!-- Stat Pill Tags in Foreground -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="12" y="21" font-family="system-ui" font-size="14" font-weight="600" fill="#38bdf8">🌐 SaaS Platforms</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="187" y="21" font-family="system-ui" font-size="14" font-weight="600" fill="#a855f7">⚡ Open-Source DNS</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="170" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="382" y="21" font-family="system-ui" font-size="14" font-weight="600" fill="#4ade80">🔒 Digital Wardship</text>
    </g>
  </g>
</svg>
